name: Sync discussions

on:
  discussion:
    types: [created, edited, deleted, labeled, unlabeled, category_changed]
  workflow_dispatch:

concurrency:
  group: sync-discussions
  cancel-in-progress: false

permissions:
  contents: write
  discussions: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      PUPPETEER_SKIP_DOWNLOAD: "true"
      CF_PAGES_BRANCH: main
    steps:
      # Credentials are kept so the publish step below can push. The branch is
      # main because a labelled discussion publishes straight to production:
      # the gate is the publish label and draft flag in the discussion itself,
      # plus the validation below, not a pull request nobody else reviews.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci
      - run: pip install -r requirements.txt
      - run: npm run discussions:validate
      - name: Materialize published discussions
        run: npm run discussions:sync
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Format generated Markdown
        run: npx prettier --write src/content/blog src/content/projects

      - run: npm run format:check
      - run: npm run elements:validate
      - run: npm run build
      - run: python scripts/privacy-check.py

      - name: Publish to main
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The content and asset roots rather than their four subdirectories:
          # git add aborts on a pathspec that matches nothing, and an asset
          # directory only exists once a post has attached something. Listing
          # src/assets/blog failed every sync until the first blog attachment.
          git add -- src/content src/assets

          if git diff --cached --quiet; then
            echo "No content changes to publish."
            exit 0
          fi

          git commit -m "content(discussions): Sync published discussions"

          # Another commit may have landed on main while this job was building.
          # Rebasing keeps the publish a fast-forward; a genuine conflict fails
          # the run rather than guessing, and the next discussion event
          # regenerates the whole tree from scratch anyway.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
