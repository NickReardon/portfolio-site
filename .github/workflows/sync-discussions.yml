name: Sync discussions

on:
  discussion:
    types: [created, edited, deleted, labeled, unlabeled, category_changed]
  workflow_dispatch:

concurrency:
  group: sync-discussions
  cancel-in-progress: false

permissions:
  contents: write
  discussions: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      PUPPETEER_SKIP_DOWNLOAD: "true"
      CF_PAGES_BRANCH: main
    steps:
      # The branch is main because a labelled discussion publishes straight to
      # production: the gate is the publish label and draft flag in the
      # discussion itself, plus the validation below, not a pull request
      # nobody else reviews. Credentials are not persisted, so npm ci and the
      # build never see a write token in .git/config; only the publish step
      # gets one.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          # Full history: the staging fast-forward below needs the commits
          # connecting staging to main locally. A shallow clone cannot
          # demonstrate that ancestry and the push is rejected.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci
      - run: pip install -r requirements.txt
      - run: npm run discussions:validate
      - name: Materialize published discussions
        run: npm run discussions:sync
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Format generated Markdown
        run: npx prettier --write src/content/blog src/content/projects

      - run: npm run format:check
      - run: npm run elements:validate
      - run: npm run build
      - run: python scripts/privacy-check.py

      - name: Publish to main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The content and asset roots rather than their four subdirectories:
          # git add aborts on a pathspec that matches nothing, and an asset
          # directory only exists once a post has attached something. Listing
          # src/assets/blog failed every sync until the first blog attachment.
          git add -- src/content src/assets

          if git diff --cached --quiet; then
            echo "No content changes to publish."
          else
            git commit -m "content(discussions): Sync published discussions"

            # Another commit may have landed on main while this job was
            # building. Rebasing keeps the publish a fast-forward; a genuine
            # conflict fails the run rather than guessing, and the next
            # discussion event regenerates the whole tree from scratch anyway.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

          # Keep the staging preview in step with production whether or not
          # this run published anything. staging can be behind from an earlier
          # run or from a promotion merge, and gating this on "there was
          # something to commit" leaves it behind for good once main is already
          # correct. Asking about ancestry directly also says why staging is or
          # is not getting the content; a bare push failure cannot tell
          # unmerged work on staging from a transport problem.
          git fetch origin main staging
          if git merge-base --is-ancestor origin/staging origin/main; then
            git push origin "$(git rev-parse origin/main):refs/heads/staging"
          else
            echo "::warning::staging carries commits that are not on main, so it did not receive this content. It will pick it up at the next promotion."
          fi
