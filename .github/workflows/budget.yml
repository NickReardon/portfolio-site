name: Build and Budget

# Runs on PRs into staging as well as main. The production gate only fires on
# main, which is too late to learn that a page outgrew its first-flight budget —
# by then the change has already landed on staging.
on:
  pull_request:
    branches:
      - main
      - staging
  workflow_dispatch:

jobs:
  build:
    name: Build and check first-flight budget
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      # `prebuild` chains content:validate and astro check, so this covers
      # content validation and typechecking as well as the build itself.
      - name: Build
        run: npm run build

      - name: Check first-flight budget
        run: npm run check:first-flight
