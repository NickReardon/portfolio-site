name: Production Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  staging-ready:
    name: Staging deployment is ready
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Require staging as the source branch
        if: github.event_name == 'pull_request'
        run: |
          if [ "${{ github.head_ref }}" != "staging" ]; then
            echo "Production PRs must merge from staging into main."
            echo "Current source branch: ${{ github.head_ref }}"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # This asserts the invariant rather than probing the deployed site. The
      # previous version fetched staging.nick-reardon.com and looked for a
      # noindex tag, which broke once Cloudflare started returning 403 to the
      # runner's datacenter IP — a false failure that said nothing about the
      # code. Cloudflare's own Pages check already proves staging deployed.
      #
      # The bug this guards against shipped earlier: indexability was keyed on
      # CF_PAGES rather than the branch, so staging built as crawlable and
      # production, deployed from a staging checkout, built as noindex.
      - name: A staging build must not be indexable
        env:
          CF_PAGES_BRANCH: staging
        run: |
          npm run build
          if ! grep -qi '<meta name="robots" content="noindex' dist/index.html; then
            echo "A staging build did not emit noindex metadata."
            exit 1
          fi
          if ! grep -q 'Disallow: /' dist/robots.txt; then
            echo "A staging build did not emit a disallowing robots.txt."
            exit 1
          fi

      - name: A production build must be indexable
        env:
          CF_PAGES_BRANCH: main
        run: |
          npm run build
          if grep -qi '<meta name="robots" content="noindex' dist/index.html; then
            echo "A production build emitted noindex metadata."
            exit 1
          fi
          if ! grep -q 'Allow: /' dist/robots.txt; then
            echo "A production build did not emit an allowing robots.txt."
            exit 1
          fi
