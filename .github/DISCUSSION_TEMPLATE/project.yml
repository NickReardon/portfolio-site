# Template for the Project category. The filename must stay equal to the
# category slug, and this file only takes effect from the default branch.
#
# Deliberately no `labels:` key: see the note in blog.yml.
body:
  - type: markdown
    attributes:
      value: |
        The block below mirrors `src/content/projects/`. Keep the `yaml` fence
        first and fill in every field: it is the project's frontmatter, so the
        build validates it against the projects schema in
        `src/content.config.ts`.

        `projectType` must be one of `game`, `system`, or `writeup`. Optional
        fields can be deleted outright rather than left empty.

        `coverImage` and `coverAlt` are absent on purpose. That schema uses
        Astro's `image()` helper, which needs an asset committed under
        `src/assets/projects/` for hashing and cropping, so a cover cannot come
        from a discussion. Add it to the synced file.
  - type: textarea
    id: content
    attributes:
      label: Project
      value: |
        ```yaml
        title: ""
        description: ""
        date: YYYY-MM-DD
        timeline: ""
        tags: []
        projectType: "writeup"
        role: ""
        status: ""
        engine: ""
        featured: false
        githubUrl: ""
        videoUrl: ""
        externalUrl: ""
        externalLabel: ""
        draft: false
        ```

        ## Overview

        What it is and what you did on it.

        ## Systems

        The work worth showing.
    validations:
      required: true
